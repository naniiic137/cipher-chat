name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (strict TS in shared, server, client)
        run: npm run typecheck
      - name: Tests (crypto vectors, protocol, relay, end-to-end, blind-relay integration)
        run: npm test
      - name: Build server + client
        run: npm run build
      - name: Build offline demo (GitHub Pages bundle)
        run: npm run build:demo
